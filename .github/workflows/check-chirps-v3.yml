name: Check CHIRPS v3 against Josh province totals

# One-off diagnostic (manual only). Compares Earth Engine CHIRPS v3 daily
# province sums with pipeline/summed_adm1_chirps3.csv from the CDI pipeline.
# Read-only: commits nothing. Results are in the log and the uploaded artifact.
# Safe to delete this file once the comparison has been reviewed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api

      - name: Prepare Earth Engine credentials
        env:
          EARTHENGINE_SERVICE_ACCOUNT_JSON: ${{ secrets.EARTHENGINE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$EARTHENGINE_SERVICE_ACCOUNT_JSON" || (echo "Missing secret EARTHENGINE_SERVICE_ACCOUNT_JSON" && exit 1)
          printf '%s' "$EARTHENGINE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/ee-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ee-service-account.json" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/ee-service-account.json", encoding="utf-8") as f:
              info = json.load(f)
          print("EARTHENGINE_PROJECT=" + info.get("project_id", "trekky675"))
          PY

      - name: Compare Earth Engine CHIRPS v3 with Josh's province totals
        run: |
          python scripts/check_chirps_v3_vs_josh.py \
            --josh-csv pipeline/summed_adm1_chirps3.csv \
            --output chirps_v3_check.csv

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: chirps-v3-check
          path: chirps_v3_check.csv
