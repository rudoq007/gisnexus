name: Update integrated composite priority

on:
  workflow_dispatch:
  schedule:
    - cron: "45 2 * * *"

permissions:
  contents: write

jobs:
  build-integrated-composite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install earthengine-api rasterio fiona

      - name: Prepare Earth Engine credentials
        env:
          EARTHENGINE_SERVICE_ACCOUNT_JSON: ${{ secrets.EARTHENGINE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$EARTHENGINE_SERVICE_ACCOUNT_JSON" || (echo "Missing secret EARTHENGINE_SERVICE_ACCOUNT_JSON" && exit 1)
          printf '%s' "$EARTHENGINE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/ee-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ee-service-account.json" >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json, os
          with open(os.environ["RUNNER_TEMP"] + "/ee-service-account.json", encoding="utf-8") as f:
              info = json.load(f)
          print("EARTHENGINE_PROJECT=" + info.get("project_id", "trekky675"))
          PY

      - name: Build integrated composite outputs
        run: |
          python scripts/build_integrated_composite.py \
            --json-output data/integrated_priority_latest.json \
            --csv-output data/integrated_priority_latest.csv \
            --tif-output data/composite_biophysical_stress.tif

      - name: Build pixel-level CDI layer and patch composite output
        # Non-blocking: this layer is newer and still approximates SPI-1/soil-moisture
        # (see script docstring). A failure here (e.g. cdi_example_latest.json missing
        # because no PNG_CDI.rds has been committed yet) must not break the
        # already-working nightly composite commit below.
        continue-on-error: true
        run: |
          python scripts/build_cdi_pixel.py \
            --json-output data/integrated_priority_latest.json \
            --tif-output data/cdi_pixel_latest.tif

      - name: Link CDI raster to census-unit population (NSO 2024)
        # Also non-blocking, and also depends on the previous step's GeoTIFF --
        # skips itself gracefully (via the script's own file-existence check)
        # if that step didn't produce one yet.
        continue-on-error: true
        run: |
          python scripts/build_cdi_population_exposure.py \
            --cu-gpkg pipeline/CU_reference_imputed.gpkg \
            --cdi-raster data/cdi_pixel_latest.tif \
            --json-output data/cdi_population_exposure.json

      - name: Commit and push outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add each path only if it actually exists -- the CDI-pixel and
          # population-exposure steps above are intentionally non-blocking, so
          # their outputs may legitimately be missing on a given run. A plain
          # `git add` on a missing path fails with exit 128 and used to take
          # this whole (otherwise unrelated) step down with it, defeating the
          # point of continue-on-error on those steps.
          for f in data/integrated_priority_latest.json data/integrated_priority_latest.csv data/composite_biophysical_stress.tif data/cdi_pixel_latest.tif data/cdi_population_exposure.json scripts/build_integrated_composite.py scripts/build_cdi_pixel.py scripts/build_cdi_population_exposure.py .github/workflows/update-integrated-composite.yml; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "  (skipping $f -- not present this run)"
            fi
          done
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Update integrated composite priority and pixel-level CDI outputs"
          git push
